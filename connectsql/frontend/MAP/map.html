<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAP VIEW</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" />
   <link rel="stylesheet" href="../leaflet-routing-machine-3.2.12/dist/leaflet-routing-machine.css">

    <style>
        #map {
            width: 100%;
            height: 90vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../leaflet-routing-machine-3.2.12/dist/leaflet-routing-machine.js"></script>
    <script>
       const clickedBusStops = JSON.parse(localStorage.getItem("clickedBusStops"));

if (!clickedBusStops || clickedBusStops.length === 0) {
    alert("No bus stops data found.");
} else {
    // Initialize the map
    const map = L.map('map').setView([clickedBusStops[0].latitude, clickedBusStops[0].longitude], 13);

    // Add OpenStreetMap tiles
    const osm = L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    });
    osm.addTo(map);

    // Convert waypoints to LatLng objects
    const waypoints = clickedBusStops.map(stop => L.latLng(stop.latitude, stop.longitude));

    // Add routing control with markers and popups
    L.Routing.control({
        waypoints: waypoints,
        lineOptions: {
            addWaypoints: false,
            draggable: false
        },
        createMarker: function (i, waypoint, n) {
            // Get the stop data (name and number) from the waypoints array
            const stopData = clickedBusStops[i];

            // Create a marker
            const marker = L.marker(waypoint.latLng, {
                draggable: false
            });

            // Add a popup with stop number and stop name
            marker.bindPopup(`
                <b>Stop ${i + 1}</b><br>
            <b>Name:</b> ${stopData.stopName}<br>
           
            `);

            return marker;
        },
        show: false // Hide the direction box
    }).addTo(map);
}
    </script>
</body>
</html>
